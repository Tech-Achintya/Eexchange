# ============================================================
# PROD profile
# ============================================================
# Activated with SPRING_PROFILES_ACTIVE=prod.
# PostgreSQL: Supabase. Redis: Upstash.
# Every credential comes from the deployment environment
# (AWS env vars / Secrets Manager). Never hardcode secrets here.
# ============================================================

# --- PostgreSQL (Supabase) ---
# Use the direct port 5432 or the session pooler, never the
# transaction pooler on 6543, because Flyway runs DDL.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${POSTGRES_DB}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# --- Redis (Upstash) ---
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}

# --- Production safety ---
spring.flyway.clean-disabled=true
logging.level.com.eexchange.backend=INFO
app.password-reset.base-url=${APP_PASSWORD_RESET_BASE_URL}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
