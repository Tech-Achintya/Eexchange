# ============================================================
# LOCAL profile
# ============================================================
# Activated with SPRING_PROFILES_ACTIVE=local.
# PostgreSQL and Redis run in Docker (see docker-compose.yml).
# The backend itself runs from IntelliJ/Maven on the host.
# ============================================================

# --- PostgreSQL (Docker) ---
spring.datasource.url=jdbc:postgresql://localhost:${LOCAL_DB_PORT:5432}/${LOCAL_DB_NAME:eexchange}?sslmode=disable
spring.datasource.username=${LOCAL_DB_USER:eexchange_user}
spring.datasource.password=${LOCAL_DB_PASSWORD:local_dev_password}

# --- Redis (Docker) ---
spring.data.redis.host=localhost
spring.data.redis.port=${LOCAL_REDIS_PORT:6379}
spring.data.redis.password=${LOCAL_REDIS_PASSWORD:local_redis_password}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}
spring.data.redis.ssl.enabled=false

# --- Local development conveniences ---
logging.level.com.eexchange.backend=DEBUG
app.password-reset.base-url=${APP_PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
