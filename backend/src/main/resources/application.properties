spring.application.name=eexchange-backend

# ============================================================
# JPA / Hibernate
# ============================================================
# Datasource URL and credentials are profile-specific:
#   local -> application-local.properties (Docker PostgreSQL)
#   prod  -> application-prod.properties  (Supabase via env vars)
# There is deliberately no default profile, so a missing
# SPRING_PROFILES_ACTIVE fails fast instead of silently using
# the wrong database.

spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=EexchangeHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# ============================================================
# Redis
# ============================================================
# Connection settings are profile-specific:
#   local -> Docker Redis on localhost, no TLS
#   prod  -> Upstash over TLS via REDIS_SSL=true

# ============================================================
# Caffeine cache
# ============================================================
spring.cache.type=caffeine
spring.cache.cache-names=collegeDomains,colleges
spring.cache.caffeine.spec=maximumSize=10,expireAfterWrite=10m

# ============================================================
# Redis college feed cache
# ============================================================
app.cache.feed.default-ttl-seconds=${FEED_CACHE_DEFAULT_TTL_SECONDS:3600}
app.cache.feed.min-ttl-seconds=${FEED_CACHE_MIN_TTL_SECONDS:60}
app.cache.feed.fill-lock-ttl-seconds=${FEED_CACHE_FILL_LOCK_TTL_SECONDS:5}

# ============================================================
# Login lockout
# ============================================================
app.login.max-failures=${APP_LOGIN_MAX_FAILURES:5}
app.login.lockout-seconds=${APP_LOGIN_LOCKOUT_SECONDS:900}

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiry-ms=${APP_JWT_EXPIRY_MS:36000000}
app.admin.jwt.secret=${APP_ADMIN_JWT_SECRET}
app.admin.jwt.expiry-ms=${APP_ADMIN_JWT_EXPIRY_MS:7200000}

# ============================================================
# OTP
# ============================================================
# A code stays valid for 15 minutes.
app.otp.ttl-seconds=${APP_OTP_TTL_SECONDS:900}
app.otp.max-attempts=${APP_OTP_MAX_ATTEMPTS:5}
# Resends are allowed after a 30-second window.
app.otp.cooldown-seconds=${APP_OTP_COOLDOWN_SECONDS:30}
app.otp.hourly-max=${APP_OTP_HOURLY_MAX:5}

# ============================================================
# Email (Brevo)
# ============================================================
BREVO_API_KEY=${BREVO_API_KEY}
BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
BREVO_SENDER_NAME=${BREVO_SENDER_NAME:EExchange}

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================================
# Password reset
# ============================================================
# Reset link is valid for 15 minutes; resends have a 30-second window.
app.password-reset.ttl-seconds=${APP_PASSWORD_RESET_TTL_SECONDS:900}
app.password-reset.cooldown-seconds=${APP_PASSWORD_RESET_COOLDOWN_SECONDS:30}
app.password-reset.hourly-max=${APP_PASSWORD_RESET_HOURLY_MAX:5}

# ============================================================
# Server / CORS / auth rate limit
# ============================================================
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

app.security.auth-rate-limit-per-minute=${APP_SECURITY_AUTH_RATE_LIMIT_PER_MINUTE:60}

app.admin.bootstrap.username=${APP_ADMIN_USERNAME:}
app.admin.bootstrap.email=${APP_ADMIN_EMAIL:}
app.admin.bootstrap.password=${APP_ADMIN_PASSWORD:}

server.forward-headers-strategy=native

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n


# ============================================================
# Post uploads / posts
# ============================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

app.post.expiry-days=${APP_POST_EXPIRY_DAYS:60}
app.post.max-images=${APP_POST_MAX_IMAGES:5}
# Lifetime content edits allowed before a post is frozen in MANUAL_REVIEW.
app.post.max-edits-before-manual-review=${APP_POST_MAX_EDITS_BEFORE_MANUAL_REVIEW:5}
app.name=${APP_NAME:Eexchange}

# ============================================================
# Storage (AWS S3 ? required in every profile)
# ============================================================
app.storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}
app.storage.s3.bucket=${S3_BUCKET:}
app.storage.s3.region=${S3_REGION:}
app.storage.s3.access-key=${AWS_ACCESS_KEY_ID:}
app.storage.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Let Spring MVC throw NoHandlerFoundException for unknown paths instead of
# serving a static 404 page/whitelabel response.
spring.mvc.throw-exception-if-no-handler-found=true
# Required companion: without this, the resource handler swallows unknown paths.
spring.web.resources.add-mappings=false

# ============================================================
# AI moderation (OpenRouter)
# ============================================================
moderation.provider=${MODERATION_PROVIDER:openrouter}
moderation.api-key=${OPENROUTER_API_KEY:}
moderation.model=${OPENROUTER_MODEL:nvidia/nemotron-3.5-super-vl}
moderation.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
moderation.timeout-seconds=${MODERATION_TIMEOUT_SECONDS:60}
moderation.malformed-retries=${MODERATION_MALFORMED_RETRIES:1}
moderation.daily-budget=${MODERATION_DAILY_BUDGET:45}
moderation.max-attempts=${MODERATION_MAX_ATTEMPTS:3}
moderation.job-batch-size=${MODERATION_JOB_BATCH_SIZE:5}
moderation.backoff-minutes=${MODERATION_BACKOFF_MINUTES:5,15,60}
moderation.job-delay-ms=${MODERATION_JOB_DELAY_MS:60000}

app.reports.auto-hide-threshold=${APP_REPORTS_AUTO_HIDE_THRESHOLD:3}

# Admin user management
app.admin.max-temp-block-days=${APP_ADMIN_MAX_TEMP_BLOCK_DAYS:90}