# ============================================================
# Eexchange Backend — application.properties
# ============================================================
# 🎓 THE ${VAR:defaultValue} PATTERN:
#   ${VAR}           → fails fast at startup if VAR is missing
#   ${VAR:fallback}  → uses fallback if VAR is missing (local dev convenience)
#   All real secrets and overrides are defined in .env / system env.
# ============================================================

spring.application.name=eexchange-backend

# ============================================================
# PostgreSQL / JPA
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:eexchange}
spring.datasource.username=${POSTGRES_USER:eexchange_user}
spring.datasource.password=${POSTGRES_PASSWORD:eexchange_dev_secret_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- HikariCP Connection Pool ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=EexchangeHikariPool

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Flyway — Database Migrations
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
spring.flyway.out-of-order=false

# ============================================================
# Redis
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis_dev_secret_456}

# Lettuce connection pool
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# ============================================================
# Caching (backed by Caffeine in-memory cache)
# ============================================================
spring.cache.type=caffeine
spring.cache.cache-names=collegeDomains
spring.cache.caffeine.spec=maximumSize=10,expireAfterWrite=10m

# ============================================================
# Login Lockout Settings
# ============================================================
app.login.max-failures=${APP_LOGIN_MAX_FAILURES:5}
app.login.lockout-seconds=${APP_LOGIN_LOCKOUT_SECONDS:900}

# ============================================================
# JWT Settings
# ============================================================
app.jwt.secret=${APP_JWT_SECRET:CHANGE_ME_generate_with_openssl_rand_base64_48}
app.jwt.expiry-ms=${APP_JWT_EXPIRY_MS:36000000}
app.admin.jwt.secret=${APP_ADMIN_JWT_SECRET:CHANGE_ME_generate_with_openssl_rand_base64_48}
app.admin.jwt.expiry-ms=${APP_ADMIN_JWT_EXPIRY_MS:7200000}

# ============================================================
# OTP Settings
# ============================================================
app.otp.ttl-seconds=${APP_OTP_TTL_SECONDS:60}
app.otp.max-attempts=${APP_OTP_MAX_ATTEMPTS:20}
app.otp.cooldown-seconds=${APP_OTP_COOLDOWN_SECONDS:60}
app.otp.hourly-max=${APP_OTP_HOURLY_MAX:20}

# ============================================================
# Email (Brevo)
# ============================================================
BREVO_API_KEY=${BREVO_API_KEY}
BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:achintya11022006@gmail.com}
BREVO_SENDER_NAME=${BREVO_SENDER_NAME:EExchange}

# ============================================================
# Actuator — Health & Metrics endpoints
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================================
# Password Reset Link Settings
# ============================================================
app.password-reset.ttl-seconds=${APP_PASSWORD_RESET_TTL_SECONDS:120}
app.password-reset.base-url=${APP_PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
