spring.application.name=eexchange-backend

# ============================================================
# PostgreSQL / JPA
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:eexchange}
spring.datasource.username=${POSTGRES_USER:eexchange_user}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=EexchangeHikariPool

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=false

# ============================================================
# Redis
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# ============================================================
# Caffeine cache
# ============================================================
spring.cache.type=caffeine
spring.cache.cache-names=collegeDomains,colleges
spring.cache.caffeine.spec=maximumSize=10,expireAfterWrite=10m

# ============================================================
# Login lockout
# ============================================================
app.login.max-failures=${APP_LOGIN_MAX_FAILURES:5}
app.login.lockout-seconds=${APP_LOGIN_LOCKOUT_SECONDS:900}

# ============================================================
# JWT
# ============================================================
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiry-ms=${APP_JWT_EXPIRY_MS:36000000}
app.admin.jwt.secret=${APP_ADMIN_JWT_SECRET}
app.admin.jwt.expiry-ms=${APP_ADMIN_JWT_EXPIRY_MS:7200000}

# ============================================================
# OTP
# ============================================================
app.otp.ttl-seconds=${APP_OTP_TTL_SECONDS:600}
app.otp.max-attempts=${APP_OTP_MAX_ATTEMPTS:5}
app.otp.cooldown-seconds=${APP_OTP_COOLDOWN_SECONDS:60}
app.otp.hourly-max=${APP_OTP_HOURLY_MAX:5}

# ============================================================
# Email (Brevo)
# ============================================================
BREVO_API_KEY=${BREVO_API_KEY}
BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
BREVO_SENDER_NAME=${BREVO_SENDER_NAME:EExchange}

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ============================================================
# Password reset
# ============================================================
app.password-reset.ttl-seconds=${APP_PASSWORD_RESET_TTL_SECONDS:900}
app.password-reset.cooldown-seconds=${APP_PASSWORD_RESET_COOLDOWN_SECONDS:60}
app.password-reset.hourly-max=${APP_PASSWORD_RESET_HOURLY_MAX:5}
app.password-reset.base-url=${APP_PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}

# ============================================================
# Server / CORS / auth rate limit
# ============================================================
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://eexchange-site.netlify.app,https://frontend-eexchange.vercel.app}
app.security.auth-rate-limit-per-minute=${APP_SECURITY_AUTH_RATE_LIMIT_PER_MINUTE:20}

app.admin.bootstrap.username=${APP_ADMIN_USERNAME:}
app.admin.bootstrap.email=${APP_ADMIN_EMAIL:}
app.admin.bootstrap.password=${APP_ADMIN_PASSWORD:}

server.forward-headers-strategy=native

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n

