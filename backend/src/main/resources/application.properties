# ============================================================
# Eexchange Backend — application.properties
# ============================================================
# 🎓 HOW SPRING PROFILES WORK:
#   This file is the base config — always loaded.
#   application-local.properties overrides it for local dev.
#   Set active profile via env var: SPRING_PROFILES_ACTIVE=local
#
# 🎓 THE ${VAR:defaultValue} PATTERN:
#   ${VAR}           → fails fast at startup if VAR is missing (good for prod)
#   ${VAR:fallback}  → uses fallback if VAR is missing (good for optional config)
#   NEVER hardcode secrets — always use env vars.
# ============================================================

spring.application.name=eexchange-backend

# ============================================================
# PostgreSQL / JPA
# ============================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:eexchange}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- HikariCP Connection Pool ----
# 🎓 WHY tune HikariCP?
#   The connection pool is the bridge between your app and Postgres.
#   Too few connections → requests queue up and timeout.
#   Too many → Postgres gets overwhelmed (default max_connections=100).
#   Rule of thumb for a single-instance app: 10–20 connections.
#   Formula: connections = (core_count * 2) + effective_spindle_count
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.pool-name=EexchangeHikariPool

# ---- JPA / Hibernate ----
# 🎓 WHY validate (not create/update)?
#   In production NEVER let Hibernate auto-create or alter tables —
#   that skips Flyway and makes schema changes untraceable.
#   'validate' makes Hibernate check that the DB matches your entities
#   on startup, and CRASH if there's a mismatch — that's a good safety net.
spring.jpa.hibernate.ddl-auto=validate

# 🎓 WHY defer datasource initialization?
#   Flyway must run BEFORE Hibernate validates the schema.
#   This ordering flag ensures that sequence.
spring.jpa.defer-datasource-initialization=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 🎓 Show SQL in dev only (we turn this OFF in prod via profile override)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# 🎓 Naming strategy: maps camelCase Java fields to snake_case DB columns automatically
#   e.g., createdAt → created_at, collegeId → college_id
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy

# ============================================================
# Flyway — Database Migrations
# ============================================================
# 🎓 Flyway reads scripts from classpath:db/migration/ by default.
#   V1__init_schema.sql runs first (versioned, runs once).
#   R__seed_data.sql runs on every boot IF its checksum changed
#   (repeatable migrations, good for reference/seed data updates).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# 🎓 Out-of-order=false (default) means migrations must be applied
#   in order. If someone on your team adds V3 before V2 is merged,
#   Flyway will refuse to run. This prevents chaos in a team setting.
spring.flyway.out-of-order=false

# ============================================================
# Redis
# ============================================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# 🎓 Lettuce connection pool — Lettuce is async and thread-safe,
#   so a pool of 8 connections handles high concurrency well.
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1ms

# ============================================================
# ============================================================
# Caching (backed by Caffeine in-memory cache)
# ============================================================
spring.cache.type=caffeine
spring.cache.cache-names=collegeDomains
spring.cache.caffeine.spec=maximumSize=10,expireAfterWrite=10m

# ============================================================
# Login Lockout Settings
# ============================================================
app.login.max-failures=5
app.login.lockout-seconds=900

# ============================================================
# JWT
# ============================================================
# 🎓 Two separate secrets for user vs admin tokens.
#   Why? So a compromised user token cannot be replayed against
#   admin endpoints even if the filter logic has a bug.
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiry-ms=${APP_JWT_EXPIRY_MS:36000000}
app.admin.jwt.secret=${APP_ADMIN_JWT_SECRET:${APP_JWT_SECRET}}
app.admin.jwt.expiry-ms=${APP_ADMIN_JWT_EXPIRY_MS:7200000}

# ============================================================
# OTP Settings (tunable without code changes)
# ============================================================
app.otp.ttl-seconds=600
app.otp.max-attempts=5
app.otp.cooldown-seconds=60
app.otp.hourly-max=5

# ============================================================
# Email (Brevo)
# ============================================================
BREVO_API_KEY=${BREVO_API_KEY}
BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL:achintya11022006@gmail.com}
BREVO_SENDER_NAME=${BREVO_SENDER_NAME:EExchange}

# ============================================================
# Actuator — Health & Metrics endpoints (production monitoring)
# ============================================================
# 🎓 In production you'd expose these only on a management port
#   or behind an internal VPC. For now, only /actuator/health is open.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized